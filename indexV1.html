<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rescate de Leads · Call Center DITALCAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --rojo:#9D202F; --negro:#1E1E1E; --burdeos:#28090A; --crema:#FFFEF1; --arena:#CAC59D; --tierra:#B7997B;
  --bg:var(--crema); --fg:var(--negro); --panel:#FFFFFF; --line:#E6E2CF; --muted:#6B6456; --soft:#F6F3E6;
  --ok:#2E7D4F; --okbg:#E3F2E8; --med:#B8860B; --medbg:#FBF3D5; --bad:#9D202F; --badbg:#F9E3E5;
  --ac:#9D202F; --ac-fg:#FFFFFF; --ac-soft:#F6E6E8; --ac-line:#D9B3B8;
  --ft:"Montserrat","Segoe UI",Arial,sans-serif; --fb:"Inter","Segoe UI",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --bg:#1A1412; --fg:#F3EEE3; --panel:#241C19; --line:#3C322D; --muted:#B5AA98; --soft:#2C2320; --okbg:#1E3A2A; --medbg:#3A3215; --badbg:#3E1C21; --ac-soft:#3A2528; --ac-line:#5A3C40; } }
:root[data-theme="dark"]{ color-scheme:dark; --bg:#1A1412; --fg:#F3EEE3; --panel:#241C19; --line:#3C322D; --muted:#B5AA98; --soft:#2C2320; --okbg:#1E3A2A; --medbg:#3A3215; --badbg:#3E1C21; --ac-soft:#3A2528; --ac-line:#5A3C40; }
html{scroll-padding-top:env(safe-area-inset-top,0px)} html,body{height:100%}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--ft);font-weight:600;margin:0} h2{font-size:20px} h3{font-size:15px}
button,select,input,textarea{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--burdeos)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--burdeos);color:#FFFEF1;display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:4px solid var(--ac)}
.top img{height:34px;display:block} .top .sp{flex:1}
.top .who{display:flex;align-items:center;gap:10px;font-family:var(--ft);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--ac);color:var(--ac-fg);font-weight:600;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ac);display:inline-block;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ac)} .btn.pri{background:var(--ac);color:var(--ac-fg);border-color:var(--ac)} .btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;color:#FFFEF1;border-color:rgba(255,254,241,.35)} .btn:disabled{opacity:.5;cursor:default}
.wrap{max-width:1500px;margin:0 auto;padding:20px 18px 60px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--ft);font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tabs button.on{color:var(--fg);border-color:var(--ac)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px} .g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))} .g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.card.ag{border-top:6px solid var(--c)} .card .nm{font-family:var(--ft);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--soft);border-radius:8px;padding:8px 10px} .kpi b{display:block;font-family:var(--ft);font-size:22px;line-height:1.1} .kpi span{font-size:11px;color:var(--muted)}
.big{font-family:var(--ft);font-size:40px;font-weight:700;line-height:1;color:var(--c)}
.falta{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--c);color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.falta.listo{background:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c, var(--ac))}
.funnel{display:grid;gap:6px;margin-top:10px} .fr{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:8px;font-size:12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px} th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--soft);font-family:var(--ft);font-weight:600;font-size:11.5px;z-index:1}
th.q{background:var(--ac-soft);border-bottom:2px solid var(--ac)} td.q{background:color-mix(in srgb,var(--ac-soft) 45%, var(--panel))}
tr.pend td:first-child{box-shadow:inset 4px 0 0 var(--med)} tr.resc td:first-child{box-shadow:inset 4px 0 0 var(--ok)} tr.noresc td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
td select,td input{width:100%;min-width:90px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel)}
td select:focus,td input:focus{outline:2px solid var(--ac);outline-offset:-1px}
td select.set{border-color:var(--ac);background:var(--ac-soft)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.med{background:var(--medbg);color:var(--med)} .tag.bad{background:var(--badbg);color:var(--bad)}
.drop{border:2px dashed var(--ac-line);border-radius:12px;padding:34px;text-align:center;background:var(--ac-soft);cursor:pointer}
.drop.over{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--panel))}
.steps{display:grid;gap:14px}
.ok-ico{color:var(--ok);font-weight:700} .bad-ico{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.inicio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.perfil{border:1px solid var(--line);border-radius:14px;padding:22px 18px;background:var(--panel);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;border-top:8px solid var(--c)}
.perfil:hover{border-color:var(--c)} .perfil b{font-family:var(--ft);font-size:17px}
.tonos{display:flex;gap:6px;align-items:center} .tono{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.tono.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.sel{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel)}
.cfg table td input{min-width:120px}
.mini{font-size:11px;color:var(--muted);margin-top:4px}
.prog{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--ac);transition:width .2s}
.exp{display:none} tr.open + tr.exp{display:table-row} tr.exp td{white-space:normal;background:var(--soft);padding:10px 14px}
.vendtbl td,.vendtbl th{text-align:center} .vendtbl td:first-child,.vendtbl th:first-child{text-align:left}
.ro{opacity:.9} .nowrap{white-space:nowrap}
.srch{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media (max-width:700px){ .wrap{padding:14px 10px} .kpis{grid-template-columns:repeat(3,1fr)} .top{gap:8px;padding:8px 10px} .top img{height:26px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
.login{max-width:380px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;border-top:6px solid var(--rojo)}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:6px 0 12px}
.err{color:var(--bad);font-size:13px;margin:6px 0}
</style>
</head>

sb.auth.onAuthStateChange((ev, ses) => {

  if (ev === 'PASSWORD_RECOVERY') { S.recuperando = true; }
  S.sesion = ses; setTimeout(iniciarApp, 0);
});
async function iniciarApp() {
  if (!S.sesion) { S.perfil = null; render(); return; }
  if (S.perfil && S.perfil.id === S.sesion.user.id) { render(); return; }
  const { data, error } = await sb.from('perfiles').select('*').eq('id', S.sesion.user.id).maybeSingle();
  if (error) { S.perfilError = error.message; render(); return; }
  S.perfil = data || { rol: 'pendiente' }; S.perfilError = null;
  await Promise.all([cargarConfig(), cargarPeriodos()]);
  await cargarLeads();
  render();
}
async function cargarConfig() {
  const [v, a] = await Promise.all([sb.from('vendedores').select('*').order('nombre'), sb.from('ajustes').select('*')]);
  if (!v.error) S.vendedores = v.data; else console.warn(v.error);
  if (!a.error) for (const row of a.data) S.ajustes[row.clave] = row.valor;
  if (esJefa() || puedoCargar()) { const c = await sb.from('cargas').select('*').order('fecha', { ascending: false }).limit(60); if (!c.error) S.cargas = c.data; }
}
async function cargarPeriodos() { const { data } = await sb.rpc('periodos'); S.periodos = [...new Set([hoyPeriodo(), S.periodo, ...(data || [])])].sort().reverse(); }
async function traerTodo(q) { // pagina de a 1000 (límite por defecto de la API)
  const out = []; for (let from = 0; ; from += 1000) { const { data, error } = await q.range(from, from + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out;
}
async function cargarLeads() {
  const tok = ++S.navTok; S.cargando = true; render();
  try {
    const [cur, prev] = await Promise.all([
      traerTodo(sb.from('leads').select(COLS_LECTURA).eq('periodo', S.periodo).order('creado')),
      traerTodo(sb.from('leads').select(COLS_LIGERAS).eq('periodo', periodoPrev(S.periodo))),
    ]);
    if (tok !== S.navTok) return;   // navegación abandonada
    S.leads = cur.map(filaALead); S.leadsPrev = prev.map(filaALead);
  } catch (e) { if (tok === S.navTok) toast('Error al leer leads: ' + e.message, 5000); }
  if (tok === S.navTok) { S.cargando = false; render(); }
}
function setPeriodo(p) { S.periodo = p; LS.set('periodo', p); cargarLeads(); }

function guardarRespuesta(L, k, v) {

  const e = S.pend.get(L.id) || { cambios: {} }; e.cambios[col] = v || null; clearTimeout(e.t);

function leerArchivo(file) {
  const fr = new FileReader(); const esCsv = /\.csv$/i.test(file.name);
  S.carga = { estado: 'analizando', nombreArchivo: file.name, msg: 'Leyendo archivo…' }; render();
  fr.onload = async e => {
    try {
      let wb;
      if (esCsv) { let txt = e.target.result; if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1); wb = XLSX.read(desenvolverCsv(txt), { type: 'string', raw: true }); }
      else wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const matriz = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true });
      const mapeo = mapearColumnas(matriz);
      if (!mapeo || mapeo.hits < 4) { S.carga = null; render(); toast('No reconozco las columnas de este archivo', 5000); return; }
      const c = { estado: 'analizando', mapeo, nombreArchivo: file.name, leads: extraerLeads(matriz, mapeo, 'NUEVO'), msg: 'Revisando duplicados en la base…' };
      S.carga = c; render();
      await procesarCarga(c); c.estado = 'listo'; render();
    } catch (err) { console.error(err); S.carga = null; render(); toast('No pude leer el archivo: ' + err.message, 6000); }
  };
  if (esCsv) fr.readAsText(file, 'utf-8'); else fr.readAsArrayBuffer(file);
}
async function procesarCarga(c) {
  const hoy = hoyPeriodo(), ex = S.ajustes.exclusiones || {};
  for (const L of c.leads) { if (!L.periodo) L.periodo = hoy; L.tipo = tipoDeFila(L); }
  c.porNegocio = {}; for (const L of c.leads) c.porNegocio[L.negocio] = (c.porNegocio[L.negocio] || 0) + 1;
  c.excluidos = []; c.excluidosPor = {}; const candidatos = [];
  for (const L of c.leads) { if (excluida(L, ex)) { c.excluidos.push(L); const k = L.negocio || L.sucursal; c.excluidosPor[k] = (c.excluidosPor[k] || 0) + 1; } else candidatos.push(L); }
  // duplicados contra la base (RPC: quien carga no necesariamente ve todos los leads)
  const ids = candidatos.map(L => L.id); const existentes = new Set();
  for (let i = 0; i < ids.length; i += 500) { const { data, error } = await sb.rpc('ids_existentes', { ids: ids.slice(i, i + 500) }); if (error) throw error; (data || []).forEach(x => existentes.add(x)); }
  const vistos = new Set(); c.dupes = []; c.nuevos = [];
  for (const L of candidatos) { if (existentes.has(L.id) || vistos.has(L.id)) c.dupes.push(L); else { vistos.add(L.id); c.nuevos.push(L); } }
  c.porPeriodo = {}; for (const L of c.nuevos) c.porPeriodo[L.periodo] = (c.porPeriodo[L.periodo] || 0) + 1;
  c.periodoPrincipal = Object.entries(c.porPeriodo).sort((a, b) => b[1] - a[1])[0]?.[0] || hoy;
  const { data: cnt } = await sb.rpc('conteo_periodo', { p: c.periodoPrincipal });
  c.previos = { NUEVO: Object.fromEntries(AGENTES.map(a => [a.key, 0])), SEMINUEVO: Object.fromEntries(AGENTES.map(a => [a.key, 0])) };
  for (const r of cnt || []) if (c.previos[r.tipo]) c.previos[r.tipo][r.agente] = +r.n;
  const idx = idxVend();
  c.asig = { NUEVO: Object.fromEntries(AGENTES.map(a => [a.key, 0])), SEMINUEVO: Object.fromEntries(AGENTES.map(a => [a.key, 0])) };
  for (const tipo of ['NUEVO', 'SEMINUEVO']) Object.assign(c.asig[tipo], repartir(c.nuevos.filter(L => L.tipo === tipo), tipo, idx, c.previos[tipo]));
  c.costanera = c.nuevos.filter(L => L.costanera && L.tipo === 'NUEVO').length;
  c.sinVend = [...new Set(c.nuevos.filter(L => L.asignadoA.trim() && !buscarVendedor(idx, L.asignadoA)).map(L => L.asignadoA.trim()))];
}
async function confirmarCarga() {

  const { data: cg, error: e0 } = await sb.from('cargas').insert({ usuario: S.sesion.user.id, archivo: c.nombreArchivo, total: c.nuevos.length, asig: asigPlano, dupes: c.dupes.length, excluidos: c.excluidos.length, periodos: Object.keys(c.porPeriodo) }).select().single();

    hechos += Math.min(500, filas.length - i);
  }

}

function faltan(m) { return Math.max(0, Math.ceil(m.cargado * objetivo()) - m.contactado); }
function cardAgente(a, m, mp) {

    <div class="row" style="justify-content:space-between;margin-top:8px"><div><div class="big">${pct(m.tasaContacto)}</div><div class="small muted">tasa de contacto</div></div>
    <div class="small muted" style="text-align:right">mes anterior<br><b style="font-size:16px;color:var(--fg)">${mp.cargado ? pct(mp.tasaContacto) : '—'}</b></div></div>
    <div class="bar"><i style="width:${Math.min(100, Math.round(m.tasaContacto * 100))}%"></i></div>
    <div class="kpis"><div class="kpi"><b>${n0(m.cargado)}</b><span>cargados</span></div><div class="kpi"><b>${n0(m.contactado)}</b><span>contactados</span></div><div class="kpi"><b>${n0(m.rescatado)}</b><span>rescatados</span></div></div>
    <div class="falta ${f === 0 ? 'listo' : ''}"><span>${f === 0 ? `Objetivo ${obj}% cumplido` : `Te faltan para el ${obj}%:`}</span><b style="font-size:20px">${f === 0 ? '✓' : n0(f)}</b></div>

}
function funnelHtml(m, tipo, col) {

    : [['¿Contactado por vendedor?', m.pFfvv, m.ffvvSi], ['¿Envió presupuesto?', m.pPpto, m.pptoSi], ['¿Sigue en contacto?', m.pSigue, m.sigueSi], ['Rescatado', m.pResc, m.rescatado]];

}

  ${AGENTES.map(a => { const m = metricas(leadsPeriodo(tipo, a.key)); return `<tr><td><span class="dot" style="background:${colorAgente(a.key)}"></span> ${esc(a.nombre)}</td><td>${n0(m.cargado)}</td><td>${n0(m.contactado)}</td><td>${n0(m.noContesta)}</td><td>${n0(m.pendiente)}</td><td>${n0(m.rescatado)}</td><td>${n0(m.noRescatado)}</td><td>${pct(m.pResc)}</td></tr>`; }).join('')}

  const filas = Object.entries(por).map(([vend, arr]) => { const m = metricas(arr); const sc = scoring(m, S.ajustes.scoring); const info = buscarVendedor(idxVend(), vend); return { vend, arr, m, sc: sc.total, local: info ? info.sucursal : (arr[0].local || arr[0].sucursal || ''), jefe: info ? info.jefe : '' }; });
  filas.sort((a, b) => vf.sort === 'score' ? b.sc - a.sc : vf.sort === 'leads' ? b.m.cargado - a.m.cargado : a.vend.localeCompare(b.vend));

    : [['Leads', m => n0(m.cargado)], ['Contact.', m => n0(m.contactado)], ['No contesta', m => n0(m.noContesta)], ['En gestión CC', m => n0(m.pendiente)], ['Contacto c/vend', m => pct(m.pFfvv)], ['Sin contacto', m => pct(m.pSinFfvv)], ['Ppto env.', m => pct(m.pPpto)], ['Sigue en cont.', m => pct(m.pSigue)], ['Rescatado', m => pct(m.pResc)]];

  <div class="row" style="margin-bottom:10px;justify-content:space-between"><h2>Detalle gestión vendedores · ${nombrePeriodo(S.periodo)}</h2>
    <div class="row"><label class="small">Ejecutiva</label><select class="sel" id="vfAg"><option value="todos">Todas</option>${AGENTES.map(a => `<option value="${a.key}" ${vf.agente === a.key ? 'selected' : ''}>${esc(a.nombre)}</option>`).join('')}</select>
    <label class="small">Ordenar</label><select class="sel" id="vfSort"><option value="score" ${vf.sort === 'score' ? 'selected' : ''}>Scoring</option><option value="leads" ${vf.sort === 'leads' ? 'selected' : ''}>Leads</option><option value="nombre" ${vf.sort === 'nombre' ? 'selected' : ''}>Nombre</option></select></div></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>Gestión saludable (≥80)</span><span><i style="background:var(--med)"></i>Oportunidad de mejora (50–79)</span><span><i style="background:var(--bad)"></i>Requiere atención (&lt;50)</span><span>Clic en un vendedor: sus leads con las respuestas de cada ejecutiva.</span></div>
  <div class="tbl vendtbl" style="margin-top:8px"><table><thead><tr><th>Vendedor</th><th>Local</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}${tipo === 'NUEVO' ? '<th>Scoring</th>' : ''}</tr></thead><tbody>

  <tr class="exp"><td colspan="${cols.length + 3}"><div class="tbl" style="max-height:360px;overflow:auto"><table><thead><tr><th>Ejecutiva</th><th>Creado</th><th>Cliente</th><th>Celular</th><th>Producto</th>${Q.map(q => `<th class="q">${esc(q.t)}</th>`).join('')}</tr></thead><tbody>

function claseFila(L) { const r = L.r || {}; if (!norm(r.cc)) return 'pend'; const e = norm(r.estado); return e === 'RESCATADO' ? 'resc' : e ? 'noresc' : ''; }

/* --- Historial de cargas --- */
function vistaCargas(v) {
  v.innerHTML = `<h2>Historial de cargas</h2><div class="tbl" style="margin-top:10px"><table><thead><tr><th>Fecha</th><th>Archivo</th><th>Leads</th><th>Reparto</th><th>Duplicados</th><th>Excluidos</th><th>Meses</th><th></th></tr></thead><tbody>
  ${S.cargas.map(c => `<tr><td>${new Date(c.fecha).toLocaleString('es-CL')}</td><td>${esc(c.archivo)}</td><td>${n0(c.total)}</td><td class="small">${AGENTES.map(a => `${a.corto}: ${n0(c.asig?.[a.key])}`).join(' · ')}</td><td>${n0(c.dupes)}</td><td>${n0(c.excluidos)}</td><td class="small">${(c.periodos || []).map(nombrePeriodo).join(', ')}</td><td>${puedoCargar() ? `<button class="btn sm" data-del="${c.id}">Deshacer</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Aún no hay cargas.</td></tr>'}
  </tbody></table></div><p class="mini">“Deshacer” borra los leads de esa carga y las respuestas ingresadas sobre ellos. Solo si se cargó el archivo equivocado.</p>`;
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const c = S.cargas.find(x => String(x.id) === b.dataset.del); if (!c) return;
    if (!confirm(`¿Borrar la carga de ${c.archivo} (${c.total} leads) y todas sus respuestas?`)) return;
    b.disabled = true; const { error } = await sb.from('cargas').delete().eq('id', c.id);
    if (error) { toast('No se pudo borrar: ' + error.message); b.disabled = false; return; }
    toast('Carga eliminada'); await cargarConfig(); cargarLeads();
  });
}

    <div class="row" style="margin:8px 0"><input class="srch" id="vq" placeholder="Buscar vendedor…">${ro ? '' : '<button class="btn sm" id="vAdd">+ Agregar</button><button class="btn pri sm" id="vSave">Guardar maestro</button>'}</div>
    <div class="tbl" style="max-height:560px;overflow:auto"><table id="vtbl"><thead><tr><th>Alias (Pilot)</th><th>Nombre</th><th>Local</th><th>Jefe</th><th></th></tr></thead><tbody>
    ${S.vendedores.map(x => `<tr data-id="${x.id || ''}"><td><input data-f="alias" value="${esc(x.alias)}" ${ro ? 'readonly' : ''}></td><td><input data-f="nombre" value="${esc(x.nombre)}" ${ro ? 'readonly' : ''}></td><td><input data-f="sucursal" value="${esc(x.sucursal)}" ${ro ? 'readonly' : ''}></td><td><input data-f="jefe" value="${esc(x.jefe)}" ${ro ? 'readonly' : ''}></td><td>${ro ? '' : '<button class="btn sm" data-rm>×</button>'}</td></tr>`).join('')}
    </tbody></table></div></div></div>`;
  $('#vq').oninput = e => { const q = normName(e.target.value); v.querySelectorAll('#vtbl tbody tr').forEach(tr => { tr.style.display = !q || normName([...tr.querySelectorAll('input')].map(i => i.value).join(' ')).includes(q) ? '' : 'none'; }); };
  if (ro) return;
  const leerVend = () => [...v.querySelectorAll('#vtbl tbody tr')].map(tr => ({ id: tr.dataset.id ? +tr.dataset.id : undefined, alias: $('[data-f=alias]', tr).value.trim(), nombre: $('[data-f=nombre]', tr).value.trim().toUpperCase(), sucursal: $('[data-f=sucursal]', tr).value.trim().toUpperCase(), jefe: $('[data-f=jefe]', tr).value.trim().toUpperCase() })).filter(x => x.alias && x.nombre);

  };
}

  <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Ejecutiva</th><th>Puede cargar</th><th>Activo</th><th></th></tr></thead><tbody>

    <td><select data-f="agente"><option value="">—</option>${AGENTES.map(a => `<option value="${a.key}" ${u.agente === a.key ? 'selected' : ''}>${esc(a.nombre)}</option>`).join('')}</select></td>
    <td style="text-align:center"><input type="checkbox" data-f="puede_cargar" ${u.puede_cargar ? 'checked' : ''}></td><td style="text-align:center"><input type="checkbox" data-f="activo" ${u.activo ? 'checked' : ''}></td>

/* ===== EJECUTIVA ===== */
function renderAgente(app, key) {
  const a = AG[key], col = colorAgente(key), tonos = tonosDe(a.color), ti = LS.get('tono_' + key, 2);
  const tabs = [['leads', 'Mis leads']]; if (puedoCargar()) tabs.push(['carga', 'Cargar leads'], ['cargas', 'Historial de cargas']);
  if (!tabs.some(t => t[0] === S.tab) && S.tab !== 'cuenta') S.tab = 'leads';
  app.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>Hola ${esc(a.corto)} · ${nombrePeriodo(S.periodo)}</h2>
    <div class="tonos"><span class="small muted">Mi tono:</span>${tonos.map((t, i) => `<button class="tono ${i === ti ? 'on' : ''}" data-t="${i}" style="background:${t}" title="Tono ${i + 1}"></button>`).join('')}</div></div>
  ${tabs.length > 1 ? `<div class="tabs">${tabs.map(t => `<button class="${S.tab === t[0] ? 'on' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>` : ''}<div id="vista"></div>`;
  app.querySelectorAll('.tono').forEach(b => b.onclick = () => { LS.set('tono_' + key, +b.dataset.t); render(); });
  app.querySelectorAll('.tabs button[data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });
  const v = $('#vista');
  if (S.tab === 'carga') return vistaCarga(v); if (S.tab === 'cargas') return vistaCargas(v); if (S.tab === 'cuenta') return vistaCuenta(v);
  const leads = leadsPeriodo(S.tipo, key), m = metricas(leads), mp = metricas(S.leadsPrev.filter(L => L.tipo === S.tipo && L.agente === key)), f = faltan(m);
  v.innerHTML = `${selectorTipo()}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card ag" style="--c:${col}"><div class="nm">Mi gestión</div><div class="row" style="justify-content:space-between;margin-top:6px"><div><div class="big">${pct(m.tasaContacto)}</div><div class="small muted">tasa de contacto</div></div><div class="small muted" style="text-align:right">mes anterior<br><b style="font-size:16px;color:var(--fg)">${mp.cargado ? pct(mp.tasaContacto) : '—'}</b></div></div><div class="bar"><i style="width:${Math.min(100, Math.round(m.tasaContacto * 100))}%"></i></div>
      <div class="falta ${f === 0 ? 'listo' : ''}"><span>${f === 0 ? `¡Objetivo ${Math.round(objetivo() * 100)}% cumplido!` : `Te faltan para el ${Math.round(objetivo() * 100)}%:`}</span><b style="font-size:20px">${f === 0 ? '✓' : n0(f)}</b></div></div>
    <div class="card ag" style="--c:${col}"><div class="nm">Mis números</div><div class="kpis" style="grid-template-columns:repeat(2,1fr)"><div class="kpi"><b>${n0(m.cargado)}</b><span>cargados</span></div><div class="kpi"><b>${n0(m.contactado)}</b><span>contactados</span></div><div class="kpi"><b>${n0(m.pendiente)}</b><span>pendientes</span></div><div class="kpi"><b>${n0(m.noContesta)}</b><span>no contesta</span></div><div class="kpi"><b>${n0(m.rescatado)}</b><span>rescatados</span></div><div class="kpi"><b>${n0(m.noRescatado)}</b><span>no rescatados</span></div></div></div>
    <div class="card ag" style="--c:${col};grid-column:span 2"><div class="nm">Respuestas de los vendedores</div>${funnelHtml(m, S.tipo, col)}</div>
  </div>
  <div class="row" style="margin-bottom:8px;justify-content:space-between"><div class="row"><input class="srch" id="q" placeholder="Buscar cliente, celular, producto, vendedor…" value="${esc(S.filtro.q)}"><select class="sel" id="solo"><option value="todos" ${S.filtro.solo === 'todos' ? 'selected' : ''}>Todos</option><option value="pend" ${S.filtro.solo === 'pend' ? 'selected' : ''}>Solo pendientes</option><option value="contact" ${S.filtro.solo === 'contact' ? 'selected' : ''}>Contactados</option><option value="resc" ${S.filtro.solo === 'resc' ? 'selected' : ''}>Rescatados</option><option value="noresc" ${S.filtro.solo === 'noresc' ? 'selected' : ''}>No rescatados</option></select></div>
    <div class="legend"><span><i style="background:var(--med)"></i>Pendiente</span><span><i style="background:var(--ok)"></i>Rescatado</span><span><i style="background:var(--bad)"></i>No rescatado</span><span id="estadoGuardado" class="small"></span></div></div>
  <div class="tbl" id="tblLeads"></div>`;
  wireTipo(v); $('#q').oninput = e => { S.filtro.q = e.target.value; pintarTabla(key); }; $('#solo').onchange = e => { S.filtro.solo = e.target.value; pintarTabla(key); };
  pintarTabla(key);
}
function pintarTabla(key) {
  const tipo = S.tipo, Q = PREGUNTAS[tipo], q = normName(S.filtro.q), solo = S.filtro.solo;
  const filas = S.leads.filter(L => {
    if (L.tipo !== tipo || L.agente !== key) return false;
    if (q && !normName([L.nombre, L.apellido, L.cel, L.tel, L.producto, L.vendedor, L.asignadoA, L.email, L.doc].join(' ')).includes(q)) return false;
    const cl = claseFila(L);
    if (solo === 'pend') return cl === 'pend'; if (solo === 'contact') return norm(L.r?.cc) === 'SI'; if (solo === 'resc') return cl === 'resc'; if (solo === 'noresc') return cl === 'noresc'; return true;
  });
  const base = tipo === 'NUEVO' ? ['Creado', 'Estado lead', 'Cliente', 'RUT', 'Celular', 'Email', 'Producto', 'Vendedor', 'Sucursal', 'Suborigen'] : ['Creado', 'Cliente', 'RUT', 'Celular', 'Email', 'Producto', 'Vendedor', 'Sucursal', 'Suborigen'];
  const celda = L => tipo === 'NUEVO' ? [fmtFecha(L.creado), L.estadoLead, `${L.nombre || ''} ${L.apellido || ''}`, L.doc, L.cel || L.tel, L.email, L.producto, L.vendedor, L.sucursal, L.suborigen] : [fmtFecha(L.creado), `${L.nombre || ''} ${L.apellido || ''}`, L.doc, L.cel || L.tel, L.email, L.producto, L.vendedor, L.sucursal, L.suborigen];
  $('#tblLeads').innerHTML = `<table><thead><tr><th>#</th>${base.map(h => `<th>${h}</th>`).join('')}${Q.map(qq => `<th class="q">${esc(qq.t)}</th>`).join('')}</tr></thead><tbody>
  ${filas.map((L, n) => `<tr class="${claseFila(L)}" data-id="${esc(L.id)}"><td class="muted">${n + 1}</td>${celda(L).map((c, ci) => `<td ${ci >= 5 && ci <= 6 ? 'style="max-width:220px;overflow:hidden;text-overflow:ellipsis"' : ''} title="${esc(c)}">${esc(c)}</td>`).join('')}
    ${Q.map(qq => `<td class="q">${qq.texto ? `<input data-k="${qq.k}" value="${esc(L.r?.[qq.k] || '')}" placeholder="…" style="min-width:200px">` : `<select data-k="${qq.k}" class="${L.r?.[qq.k] ? 'set' : ''}"><option value="">—</option>${LISTAS[qq.lista].map(o => `<option ${norm(L.r?.[qq.k]) === norm(o) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="30" class="muted">Sin leads ${solo !== 'todos' ? 'con ese filtro' : 'en este mes'}.</td></tr>`}
  </tbody></table>`;
  $('#tblLeads').querySelectorAll('select,input').forEach(el => el.addEventListener('change', e => {
    const tr = e.target.closest('tr'); const L = S.leads.find(x => x.id === tr.dataset.id); if (!L) return;
    guardarRespuesta(L, e.target.dataset.k, e.target.value);
    if (e.target.tagName === 'SELECT') e.target.classList.toggle('set', !!e.target.value);
    tr.className = claseFila(L); $('#estadoGuardado').textContent = 'Guardando…';
    clearTimeout(S._kt); S._kt = setTimeout(() => { const act = document.activeElement; if (!act || !act.closest('#tblLeads')) render(); }, 3000);
  }));
}

/* ===== Exportar Excel ===== */
function exportarExcel() {
  const wb = XLSX.utils.book_new();
  const base = { NUEVO: ['Estado lead', 'Vendido', 'Producto de interes', 'Nombre', 'Apellido', 'Documento', 'Telefono', 'Celular', 'eMail', 'Origen', 'Suborigen', 'Creado el', 'Asignado a', 'Sucursal Asignada'], SEMINUEVO: ['Producto de interes', 'Nombre', 'Apellido', 'RUT', 'Telefono', 'CELULAR', 'eMail', 'Suborigen', 'Creado el', 'Asignado a', 'Sucursal Asignada'] };
  const keys = { NUEVO: ['estadoLead', 'vendido', 'producto', 'nombre', 'apellido', 'doc', 'tel', 'cel', 'email', 'origen', 'suborigen', 'creado', 'asignadoA', 'sucursal'], SEMINUEVO: ['producto', 'nombre', 'apellido', 'doc', 'tel', 'cel', 'email', 'suborigen', 'creado', 'asignadoA', 'sucursal'] };
  for (const tipo of ['NUEVO', 'SEMINUEVO']) for (const a of AGENTES) {
    const leads = leadsPeriodo(tipo, a.key); if (!leads.length) continue; const Q = PREGUNTAS[tipo];
    const rows = leads.map(L => [...keys[tipo].map(k => k === 'creado' ? fmtFecha(L[k]) : (L[k] || '')), ...Q.map(q => L.r?.[q.k] || ''), L.vendedor || '', L.jefe || '', L.local || '']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[...base[tipo], ...Q.map(q => q.t.toUpperCase()), 'VENDEDOR', 'JEFE', 'LOCAL'], ...rows]), `${tipo} ${a.corto.toUpperCase().replace('Í', 'I')}`.slice(0, 31));
  }
  const res = [['EJECUTIVA', 'TIPO', 'CARGADOS', 'CONTACTADOS', 'NO CONTESTA', 'PENDIENTES', 'TASA CONTACTO', 'RESCATADOS', 'NO RESCATADOS']];
  for (const tipo of ['NUEVO', 'SEMINUEVO']) for (const a of AGENTES) { const m = metricas(leadsPeriodo(tipo, a.key)); if (m.cargado) res.push([a.nombre, tipo, m.cargado, m.contactado, m.noContesta, m.pendiente, m.tasaContacto, m.rescatado, m.noRescatado]); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(res), 'RESUMEN');
  const vend = [['VENDEDOR', 'LOCAL', 'LEADS', 'CONTACTADO', 'NO CONTESTA', 'EN GESTION CC', 'CONTACTO C/VEND %', 'PPTO ENV %', 'SIGUE %', 'PPTO EXPLICADO %', 'INVITÓ %', 'RESCATADO %', 'SCORING']];
  const por = {}; for (const L of leadsPeriodo('NUEVO')) (por[L.vendedor || '(sin vendedor)'] = por[L.vendedor || '(sin vendedor)'] || []).push(L);
  for (const [vn, arr] of Object.entries(por)) { const m = metricas(arr); vend.push([vn, arr[0].local || '', m.cargado, m.contactado, m.noContesta, m.pendiente, m.pFfvv, m.pPpto, m.pSigue, m.pExplico, m.pInvito, m.pResc, scoring(m, S.ajustes.scoring).total]); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(vend), 'VENDEDORES');
  XLSX.writeFile(wb, `RESCATE_LEADS_${S.periodo}.xlsx`);
}
