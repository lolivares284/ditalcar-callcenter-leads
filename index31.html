<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rescate de Leads · Call Center DITALCAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --rojo:#9D202F; --negro:#1E1E1E; --burdeos:#28090A; --crema:#FFFEF1; --arena:#CAC59D; --tierra:#B7997B;
  --bg:var(--crema); --fg:var(--negro); --panel:#FFFFFF; --line:#E6E2CF; --muted:#6B6456; --soft:#F6F3E6;
  --ok:#2E7D4F; --okbg:#E3F2E8; --med:#B8860B; --medbg:#FBF3D5; --bad:#9D202F; --badbg:#F9E3E5;
  --ac:#9D202F; --ac-fg:#FFFFFF; --ac-soft:#F6E6E8; --ac-line:#D9B3B8;
  --ft:"Montserrat","Segoe UI",Arial,sans-serif; --fb:"Inter","Segoe UI",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --bg:#1A1412; --fg:#F3EEE3; --panel:#241C19; --line:#3C322D; --muted:#B5AA98; --soft:#2C2320; --okbg:#1E3A2A; --medbg:#3A3215; --badbg:#3E1C21; --ac-soft:#3A2528; --ac-line:#5A3C40; } }
:root[data-theme="dark"]{ color-scheme:dark; --bg:#1A1412; --fg:#F3EEE3; --panel:#241C19; --line:#3C322D; --muted:#B5AA98; --soft:#2C2320; --okbg:#1E3A2A; --medbg:#3A3215; --badbg:#3E1C21; --ac-soft:#3A2528; --ac-line:#5A3C40; }
html{scroll-padding-top:env(safe-area-inset-top,0px)} html,body{height:100%}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--ft);font-weight:600;margin:0} h2{font-size:20px} h3{font-size:15px}
button,select,input,textarea{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--burdeos)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--burdeos);color:#FFFEF1;display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:4px solid var(--ac)}
.top img{height:34px;display:block} .top .sp{flex:1}
.top .who{display:flex;align-items:center;gap:10px;font-family:var(--ft);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--ac);color:var(--ac-fg);font-weight:600;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ac);display:inline-block;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ac)} .btn.pri{background:var(--ac);color:var(--ac-fg);border-color:var(--ac)} .btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;color:#FFFEF1;border-color:rgba(255,254,241,.35)} .btn:disabled{opacity:.5;cursor:default}
.wrap{max-width:1500px;margin:0 auto;padding:20px 18px 60px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--ft);font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tabs button.on{color:var(--fg);border-color:var(--ac)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px} .g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))} .g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.card.ag{border-top:6px solid var(--c)} .card .nm{font-family:var(--ft);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--soft);border-radius:8px;padding:8px 10px} .kpi b{display:block;font-family:var(--ft);font-size:22px;line-height:1.1} .kpi span{font-size:11px;color:var(--muted)}
.big{font-family:var(--ft);font-size:40px;font-weight:700;line-height:1;color:var(--c)}
.falta{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--c);color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.falta.listo{background:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c, var(--ac))}
.funnel{display:grid;gap:6px;margin-top:10px} .fr{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:8px;font-size:12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px} th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--soft);font-family:var(--ft);font-weight:600;font-size:11.5px;z-index:1}
th.q{background:var(--ac-soft);border-bottom:2px solid var(--ac)} td.q{background:color-mix(in srgb,var(--ac-soft) 45%, var(--panel))}
tr.venta td:nth-child(2),tr.venta td:first-child{background:#E8F1FA} tr.pend td:first-child{box-shadow:inset 4px 0 0 var(--med)} tr.resc td:first-child{box-shadow:inset 4px 0 0 var(--ok)} tr.noresc td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
td select,td input{width:100%;min-width:90px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel)}
td select:focus,td input:focus{outline:2px solid var(--ac);outline-offset:-1px}
td select.set,td input.combo.set{border-color:var(--ac);background:var(--ac-soft)} td input.combo{font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.med{background:var(--medbg);color:var(--med)} .tag.bad{background:var(--badbg);color:var(--bad)}
.drop{border:2px dashed var(--ac-line);border-radius:12px;padding:34px;text-align:center;background:var(--ac-soft);cursor:pointer}
.drop.over{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--panel))}
.steps{display:grid;gap:14px}
.ok-ico{color:var(--ok);font-weight:700} .bad-ico{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.inicio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.perfil{border:1px solid var(--line);border-radius:14px;padding:22px 18px;background:var(--panel);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;border-top:8px solid var(--c)}
.perfil:hover{border-color:var(--c)} .perfil b{font-family:var(--ft);font-size:17px}
.tonos{display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:420px} .tono{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.tono.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.sel{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel)}
.cfg{grid-template-columns:repeat(2,minmax(0,1fr))!important} @media (max-width:1000px){.cfg{grid-template-columns:1fr!important}} .cfg table td input{width:100%;min-width:90px} .cfg .tbl table{min-width:640px}
.mini{font-size:11px;color:var(--muted);margin-top:4px}
.prog{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--ac);transition:width .2s}
.exp{display:none} tr.open + tr.exp{display:table-row} tr.exp td{white-space:normal;background:var(--soft);padding:10px 14px}
.vendtbl td,.vendtbl th{text-align:center} .vendtbl td:first-child,.vendtbl th:first-child{text-align:left}
.ro{opacity:.9} .nowrap{white-space:nowrap}
.srch{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media (max-width:700px){ .wrap{padding:14px 10px} .kpis{grid-template-columns:repeat(3,1fr)} .top{gap:8px;padding:8px 10px} .top img{height:26px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
.login{max-width:380px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;border-top:6px solid var(--rojo)}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:6px 0 12px}
.err{color:var(--bad);font-size:13px;margin:6px 0}
th.sortable{cursor:pointer;user-select:none} th.sortable.on{color:var(--ac)} th .arr{font-size:10px;opacity:.55} th.sortable.on .arr{opacity:1}
tr.filtros th{background:var(--soft);padding:3px 4px;top:31px}
.tbl-leads{max-height:calc(100vh - 150px);overflow:auto} .tbl-leads thead th{position:sticky;z-index:3} .tbl-leads thead tr:first-child th{top:0} .tbl-leads thead tr.filtros th{top:33px}
.tbl-leads table.fix .fx{position:sticky;z-index:2;background:var(--panel)} .tbl-leads table.fix thead .fx{z-index:4;background:var(--soft)} .tbl-leads table.fix .fx-last{box-shadow:inset -3px 0 0 var(--ac-line)}
.tbl-leads tbody tr{cursor:pointer} .tbl-leads tbody tr.sel td{background:var(--ac-soft)!important;box-shadow:inset 0 -2px 0 var(--ac),inset 0 2px 0 var(--ac)} .tbl-leads tbody tr.sel td:first-child{box-shadow:inset 5px 0 0 var(--ac),inset 0 -2px 0 var(--ac),inset 0 2px 0 var(--ac)} .tbl-leads tbody tr.sel td.q{background:color-mix(in srgb,var(--ac) 22%,var(--panel))!important}
.scrollbtns{display:inline-flex;gap:4px;align-items:center} #scBar{width:180px;accent-color:var(--ac)} label.small{display:flex;flex-direction:column;gap:3px} tr.filtros input,tr.filtros select{width:100%;min-width:70px;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:11px;background:var(--panel)}
.btn.alerta{border-color:var(--ac);color:var(--ac);white-space:nowrap} .btn.alerta:hover{background:var(--ac-soft)} .btn.alerta.on{background:var(--ac);color:var(--ac-fg)}
body.pres .top .who{display:flex} body.pres #topRight button,body.pres #topRight select{display:none} body.pres .wrap{max-width:none;padding:16px 24px}
body.pres .tabs{display:none} body.pres h2{font-size:28px} body.pres .big{font-size:56px} body.pres .kpi b{font-size:30px} body.pres .kpi span{font-size:13px} body.pres .card .nm{font-size:19px}
body.pres .falta{font-size:18px} body.pres .fr{font-size:15px;grid-template-columns:230px 1fr 90px} body.pres table{font-size:15px} body.pres .small{font-size:14px} body.pres .mini{font-size:12px}
body.pres .grid.g4{grid-template-columns:repeat(4,1fr)} body.pres .panel h3{font-size:20px}
/* Dito */
.dito{position:relative;padding:4px 2px 2px} .dito-msg{font-family:var(--ft);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px} .dito-face{font-size:22px}
.pista{position:relative;height:104px;border-bottom:6px solid var(--arena);margin:0 8px 6px;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(0,0,0,.04) 24px 48px)}
.pista .recorrido{position:absolute;left:0;bottom:-6px;height:6px;background:var(--c);border-radius:3px;transition:width 1s ease}
.pista .marca{position:absolute;bottom:-6px;height:100%;border-left:2px dashed var(--arena)} .pista .marca span{position:absolute;bottom:-24px;left:-14px;font-size:11px;color:var(--muted);white-space:nowrap} .pista .marca.meta{border-left:2px solid var(--ok)} .pista .marca.meta span{color:var(--ok);font-weight:600}
.btn.cp{padding:3px 6px;font-size:12px} .btn.wa{padding:3px 7px;font-size:13px;border-color:#25D366;background:#E7F9EE} .btn.wa:hover{background:#25D366} .btn.wa:disabled{background:var(--soft);border-color:var(--line)}
.auto{position:absolute;bottom:-4px;width:110px;transition:left 1.2s cubic-bezier(.4,0,.2,1);animation:bote 1.4s ease-in-out infinite} .auto .dito-img{width:110px;display:block;position:relative;z-index:2;transition:filter .4s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.dito.triste .auto{animation:bote 2.6s ease-in-out infinite} .dito.triste .dito-img{filter:saturate(.8) drop-shadow(0 4px 4px rgba(0,0,0,.25))} .dito.enfoque .auto{animation:bote .7s ease-in-out infinite} .dito.meta .auto{animation:salto .9s ease-in-out infinite}
.auto .humo{position:absolute;z-index:3;font-size:22px;left:-22px;bottom:16px;animation:humo .8s linear infinite}
.confeti{position:absolute;inset:0;pointer-events:none;overflow:hidden} .confeti i{position:absolute;top:-8px;width:7px;height:11px;border-radius:2px;animation:caer 2.4s linear infinite}
@keyframes bote{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}} @keyframes salto{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} @keyframes humo{0%{opacity:.9;transform:translateX(0)}100%{opacity:0;transform:translateX(-18px)}} @keyframes caer{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(120px) rotate(360deg);opacity:0}}
body.pres .dito-msg{font-size:22px} body.pres .pista{height:150px} body.pres .auto{width:160px} body.pres .auto .dito-img{width:160px}
@media (prefers-reduced-motion: reduce){.auto,.auto .humo,.confeti i{animation:none}}
</style>
</head>

function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9 /?¿.-]/g, ' ').replace(/\s+/g, ' ').trim();

function fixMoji(s) { s = String(s ?? ''); if (!/Ã|Â|\u00a0/.test(s)) return s; for (const [a, b] of MOJI) s = s.split(a).join(b); return s; }
function normName(s) { return norm(s).replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim(); }

// Fechas: Date | serial Excel | "dd-mm-yyyy[ hh:mm]" | ISO
function toISO(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date || Object.prototype.toString.call(v) === '[object Date]') return isNaN(v) ? '' : new Date(v.getTime()).toISOString();
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400 * 1000)); return isNaN(d) ? '' : d.toISOString(); }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if (m) return new Date(Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0))).toISOString();
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) { const d = new Date(s); return isNaN(d) ? '' : d.toISOString(); }
  return '';
}
function periodoDe(iso) { return iso ? iso.slice(0, 7) : ''; }

function nombrePeriodo(p) { if (!p) return ''; const [y, m] = p.split('-'); return `${MESES[+m - 1]} ${y}`; }
function periodoPrev(p) { const [y, m] = p.split('-').map(Number); const d = new Date(Date.UTC(y, m - 2, 1)); return d.toISOString().slice(0, 7); }

// Reconoce la fila de encabezado y mapea columnas
function mapearColumnas(matriz) {
  const tipos = ['NUEVO', 'SEMINUEVO'];
  let best = null;
  for (let r = 0; r < Math.min(15, matriz.length); r++) {
    const fila = matriz[r] || [];
    for (const tipo of tipos) {
      const map = {}; let hits = 0;
      fila.forEach((h, i) => {
        const n = norm(h); if (!n) return;
        for (const [k, ...syn] of COLS[tipo]) if (!(k in map) && syn.some(s => n === s)) { map[k] = i; hits++; break; }
      });
      if (!best || hits > best.hits) best = { fila: r, tipo, map, hits, headers: fila };
    }
  }
  return best;
}
function detectarTipo(mapeo, matriz) {
  // formato SEMINUEVO (RUT + CELULAR sin "Estado lead") o contenido con SEMINUEVO/USADO
  const hdr = mapeo.headers.map(norm);
  if (!hdr.includes('ESTADO LEAD') && hdr.includes('RUT')) return 'SEMINUEVO';
  const idx = [mapeo.map.negocio, mapeo.map.origen, mapeo.map.suborigen, mapeo.map.producto].filter(i => i != null);
  let semi = 0, n = 0;
  for (let r = mapeo.fila + 1; r < Math.min(mapeo.fila + 200, matriz.length); r++) {
    const row = matriz[r]; if (!row) continue; n++;
    if (idx.some(i => /SEMINUEVO|USADO/.test(norm(row[i])))) semi++;
  }
  return n && semi / n > 0.5 ? 'SEMINUEVO' : 'NUEVO';
}
function extraerLeads(matriz, mapeo, tipo) {

    for (const k of cols) { const i = mapeo.map[k]; L[k] = i == null ? '' : row[i]; }
    if (!String(L.nombre ?? '').trim() && !String(L.producto ?? '').trim()) continue;
    for (const k of ['creado', 'asignadoEl', 'desistidoEl']) if (k in L) L[k] = toISO(L[k]);

const metricasEquipo = (tipo, agente, prev) => { const src = prev ? S.resumen.prev : S.resumen.cur; const filas = Object.values(src).filter(r => r.tipo === tipo && (!agente || r.agente === agente)); return sumarMetricas(filas.map(metricasDeFila)); };

/* ===== Arranque / sesión ===== */
sb.auth.onAuthStateChange((ev, ses) => {
  // sin await aquí (bloquea la librería): se difiere con setTimeout
  if (ev === 'PASSWORD_RECOVERY') { S.recuperando = true; }
  S.sesion = ses; setTimeout(iniciarApp, 0);
});
async function iniciarApp() {
  if (!S.sesion) { S.perfil = null; render(); return; }
  if (S.perfil && S.perfil.id === S.sesion.user.id) return;   // TOKEN_REFRESHED / foco de pestaña: no volver a pintar
  const { data, error } = await sb.from('perfiles').select('*').eq('id', S.sesion.user.id).maybeSingle();
  if (error) { S.perfilError = error.message; render(); return; }
  S.perfil = data || { rol: 'pendiente' }; S.perfilError = null;
  await Promise.all([cargarConfig(), cargarPeriodos()]);
  await cargarLeads();
  render();
}
async function cargarConfig() {
  const [v, a] = await Promise.all([sb.from('vendedores').select('*').order('nombre'), sb.from('ajustes').select('*')]);
  if (!v.error) S.vendedores = v.data; else console.warn(v.error);
  if (!a.error) for (const row of a.data) S.ajustes[row.clave] = row.valor;
  aplicarListas();
  const al = await sb.from('alertas').select('*').order('fecha', { ascending: false }).order('hora', { ascending: false }).limit(2000); if (!al.error) S.alertas = al.data;
  if (esJefa() || puedoCargar()) { const c = await sb.from('cargas').select('*').order('fecha', { ascending: false }).limit(60); if (!c.error) S.cargas = c.data; }
}
async function cargarPeriodos() { const { data } = await sb.rpc('periodos'); S.periodos = [...new Set([hoyPeriodo(), S.periodo, ...(data || [])])].sort().reverse(); }
async function traerTodo(q) { // pagina de a 1000 (límite por defecto de la API)
  const out = []; for (let from = 0; ; from += 1000) { const { data, error } = await q.range(from, from + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out;
}
async function cargarLeads() {
  const tok = ++S.navTok; S.cargando = true; render();
  try {
    const [cur, prev, rc, rp, rm] = await Promise.all([
      traerTodo(sb.from('leads').select(COLS_LECTURA).eq('periodo', S.periodo).order('creado')),
      traerTodo(sb.from('leads').select(COLS_LIGERAS).eq('periodo', periodoPrev(S.periodo))),
      sb.rpc('resumen_equipo', { p: S.periodo }), sb.rpc('resumen_equipo', { p: periodoPrev(S.periodo) }), sb.rpc('resumen_marcas', { p: S.periodo }),
    ]);
    if (tok !== S.navTok) return;   // navegación abandonada
    S.leads = cur.map(filaALead); S.leadsPrev = prev.map(filaALead);
    S.resumen = { cur: Object.fromEntries((rc.data || []).map(r => [r.tipo + '|' + r.agente, r])), prev: Object.fromEntries((rp.data || []).map(r => [r.tipo + '|' + r.agente, r])) };
    S.marcas = rm.data || [];
  } catch (e) { if (tok === S.navTok) toast('Error al leer leads: ' + e.message, 5000); }
  if (tok === S.navTok) { S.cargando = false; render(); }
}
function setPeriodo(p) { S.periodo = p; LS.set('periodo', p); cargarLeads(); }

/* Guardado de respuestas: un update por lead, coalescido */
function guardarRespuesta(L, k, v) {
  L.r[k] = v; const col = RESP_DB[k]; if (k === 'estado') S.rescatados = null;
  const e = S.pend.get(L.id) || { cambios: {} }; e.cambios[col] = v || null; clearTimeout(e.t);
  e.t = setTimeout(async () => {
    S.pend.delete(L.id);
    const { error } = await sb.from('leads').update(e.cambios).eq('id_lead', L.id);
    const st = $('#estadoGuardado'); if (error) { toast('No se pudo guardar: ' + error.message, 5000); if (st) st.textContent = 'Error al guardar'; } else if (st && !S.pend.size) st.textContent = 'Guardado ✓';
  }, 600);
  S.pend.set(L.id, e);
}

function leerArchivo(file) {
  const fr = new FileReader(); const esCsv = /\.csv$/i.test(file.name);
  S.carga = { estado: 'analizando', nombreArchivo: file.name, msg: 'Leyendo archivo…' }; render();
  fr.onload = async e => {
    try {
      let wb;
      if (esCsv) { let txt = e.target.result; if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1); wb = XLSX.read(desenvolverCsv(txt), { type: 'string', raw: true }); }
      else wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const matriz = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true });
      const mapeo = mapearColumnas(matriz);
      if (!mapeo || mapeo.hits < 4) { S.carga = null; render(); toast('No reconozco las columnas de este archivo', 5000); return; }
      const c = { estado: 'analizando', mapeo, nombreArchivo: file.name, leads: extraerLeads(matriz, mapeo, 'NUEVO'), msg: 'Revisando duplicados en la base…' };
      S.carga = c; render();
      await procesarCarga(c); c.estado = 'listo'; render();
    } catch (err) { console.error(err); S.carga = null; render(); toast('No pude leer el archivo: ' + err.message, 6000); }
  };
  if (esCsv) fr.readAsText(file, 'utf-8'); else fr.readAsArrayBuffer(file);
}
async function procesarCarga(c) {
  const hoy = hoyPeriodo(), ex = S.ajustes.exclusiones || {};

  for (const L of c.leads) { L.periodoCreado = L.periodo; L.periodo = hoy; L.tipo = tipoDeFila(L); }
  c.porNegocio = {}; for (const L of c.leads) c.porNegocio[L.negocio] = (c.porNegocio[L.negocio] || 0) + 1;
  c.excluidos = []; c.excluidosPor = {}; const candidatos = [];
  for (const L of c.leads) { if (excluida(L, ex)) { c.excluidos.push(L); const k = L.negocio || L.origen || L.sucursal; c.excluidosPor[k] = (c.excluidosPor[k] || 0) + 1; } else candidatos.push(L); }
  // duplicados contra la base (RPC: quien carga no necesariamente ve todos los leads): por ID de Pilot y por RUT-teléfono-correo
  const ids = candidatos.map(L => L.id); const existentes = new Set(), clavesEx = new Set();
  for (let i = 0; i < ids.length; i += 500) { const { data, error } = await sb.rpc('ids_existentes', { ids: ids.slice(i, i + 500) }); if (error) throw error; (data || []).forEach(x => existentes.add(x)); }
  const claves = [...new Set(candidatos.map(claveDup).filter(Boolean))];
  for (let i = 0; i < claves.length; i += 500) { const { data, error } = await sb.rpc('claves_existentes', { claves: claves.slice(i, i + 500) }); if (error) { if (!/function|schema cache/i.test(error.message)) throw error; break; } (data || []).forEach(x => clavesEx.add(x)); }
  const vistos = new Set(), vistasClaves = new Set(); c.dupes = []; c.dupesClave = 0; c.nuevos = [];
  for (const L of candidatos) { const k = claveDup(L); if (existentes.has(L.id) || vistos.has(L.id)) c.dupes.push(L); else if (k && (clavesEx.has(k) || vistasClaves.has(k))) { c.dupes.push(L); c.dupesClave++; } else { vistos.add(L.id); if (k) vistasClaves.add(k); c.nuevos.push(L); } }
  c.porPeriodo = { [hoy]: c.nuevos.length }; c.periodoPrincipal = hoy;
  c.porCreado = {}; for (const L of c.nuevos) { const k = L.periodoCreado || '(sin fecha)'; c.porCreado[k] = (c.porCreado[k] || 0) + 1; }
  const { data: cnt } = await sb.rpc('conteo_periodo', { p: c.periodoPrincipal });
  c.previos = { NUEVO: Object.fromEntries(AGENTES.map(a => [a.key, 0])), SEMINUEVO: Object.fromEntries(AGENTES.map(a => [a.key, 0])) };
  c.previosMarca = { NUEVO: {}, SEMINUEVO: {} };
  for (const r of cnt || []) if (c.previos[r.tipo]) { c.previos[r.tipo][r.agente] = (c.previos[r.tipo][r.agente] || 0) + +r.n; const m = norm(r.negocio) || '(SIN MARCA)'; (c.previosMarca[r.tipo][m] = c.previosMarca[r.tipo][m] || {})[r.agente] = +r.n; }
  const idx = idxVend();
  c.asig = { NUEVO: Object.fromEntries(AGENTES.map(a => [a.key, 0])), SEMINUEVO: Object.fromEntries(AGENTES.map(a => [a.key, 0])) };
  for (const tipo of ['NUEVO', 'SEMINUEVO']) Object.assign(c.asig[tipo], repartir(c.nuevos.filter(L => L.tipo === tipo), tipo, idx, { total: c.previos[tipo], marca: c.previosMarca[tipo] }));

  c.semiOmitidos = c.nuevos.filter(L => L.tipo === 'SEMINUEVO' && !L.agente); c.nuevos = c.nuevos.filter(L => L.agente);
  c.costanera = 0;
  c.sinVend = [...new Set(c.nuevos.filter(L => L.asignadoA.trim() && !buscarVendedor(idx, L.asignadoA)).map(L => L.asignadoA.trim()))];
}
async function confirmarCarga() {

const DITO_MSG = {
  triste: ['Ánimo, {n}… todavía estamos lejos de la meta. ¡Unas llamadas más y arrancamos!', 'Hoy me cuesta, {n}. ¿Me ayudas a pasar el 50 %?', 'Vamos despacio, {n}. Cada contacto me acerca a la meta.'],
  enfoque: ['¡Modo enfoque, {n}! Pasamos la mitad: voy a llegar a la meta.', 'Acelerando, {n}. ¡Faltan {f} contactos para el 95 %!', 'Ya veo la bandera, {n}. ¡No aflojemos!'],
  meta: ['¡META CUMPLIDA, {n}! 🏆 ¡Eres lo máximo!', '¡95 % logrado, {n}! Hoy brindo contigo 🥂', '¡Campeona, {n}! Llegamos a la meta 🏁'],
};
function ditoHtml(m, tipo, nombre, col) {
  const tasa = Math.max(0, Math.min(1, tasaPrincipal(m, tipo))), f = faltan(m, tipo), obj = objetivo();
  const estado = tasa >= obj ? 'meta' : tasa >= 0.5 ? 'enfoque' : 'triste';
  const tick = Math.floor(Date.now() / 60000); const msgs = DITO_MSG[estado]; const msg = msgs[tick % msgs.length].replace('{n}', nombre).replace('{f}', n0(f));
  const spr = DITO[estado][tick % DITO[estado].length];
  const pos = Math.round(tasa * 100);
  return `<div class="dito ${estado}" style="--c:${col || 'var(--ac)'}">
    <div class="dito-msg"><span class="dito-face">${estado === 'triste' ? '💧' : estado === 'enfoque' ? '🔥' : '🎉'}</span>${esc(msg)}</div>
    <div class="pista"><div class="marca" style="left:50%"><span>50 %</span></div><div class="marca meta" style="left:${Math.round(obj * 100)}%"><span>🏁 ${Math.round(obj * 100)} %</span></div><div class="recorrido" style="width:${pos}%"></div>
      <div class="auto" style="left:calc(${pos}% - 55px)"><img src="data:image/png;base64,${spr}" alt="Dito" class="dito-img">${estado === 'enfoque' ? '<span class="humo">💨</span>' : ''}</div>
    </div>
    ${estado === 'meta' ? '<div class="confeti">' + Array.from({ length: 18 }, (_, i) => `<i style="left:${(i * 53) % 100}%;animation-delay:${(i % 6) * .25}s;background:${['#9D202F', '#FFB300', '#24D1C3', '#7030A0', '#FF00B7', '#2E7D4F'][i % 6]}"></i>`).join('') + '</div>' : ''}
  </div>`;
}

/* --- Modo presentación (pantalla del call center) --- */
function presentacion(on) {
  if (on) {
    S.pres = { tabPrev: S.tab, tipoPrev: S.tipo }; document.body.classList.add('pres');
    const seg = LS.get('presSeg', 60);
    S.pres.rot = setInterval(() => { S.tipo = S.tipo === 'NUEVO' ? 'SEMINUEVO' : 'NUEVO'; render(); }, seg * 1000);
    S.pres.ref = setInterval(() => cargarLeads(), 5 * 60 * 1000);
    S.pres.esc = e => { if (e.key === 'Escape') presentacion(false); }; document.addEventListener('keydown', S.pres.esc);
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => { }); } catch { }
  } else if (S.pres) {
    clearInterval(S.pres.rot); clearInterval(S.pres.ref); document.removeEventListener('keydown', S.pres.esc); document.body.classList.remove('pres');
    S.tab = S.pres.tabPrev; S.tipo = S.pres.tipoPrev; S.pres = null;
    try { if (document.fullscreenElement) document.exitFullscreen?.(); } catch { }
  }
  S.tab = S.pres ? 'resumen' : S.tab; render();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.pres) presentacion(false); });

  <tr class="exp"><td colspan="${cols.length + 3 + ags.length}"><div class="tbl" style="max-height:360px;overflow:auto"><table><thead><tr><th>Ejecutiva</th><th>ID Pilot</th><th>Creado</th><th>Cliente</th><th>Celular</th><th>Producto</th>${Q.map(q => `<th class="q">${esc(q.t)}</th>`).join('')}<th>Venta</th></tr></thead><tbody>
    ${f.arr.map(L => `<tr class="${claseFila(L)}"><td><span class="dot" style="background:${colorAgente(L.agente)}"></span> ${AG[L.agente]?.corto || ''}</td><td>${esc((L.id || '').replace(/^[PR]/, ''))}</td><td>${fmtFecha(L.creado)}</td><td>${esc(L.nombre)} ${esc(L.apellido || '')}</td><td>${esc(L.cel || L.tel || '')}</td><td>${esc(L.producto || '')}</td>${Q.map(q => `<td class="q">${esc(L.r?.[q.k] || '')}</td>`).join('')}<td>${L.ventaNota ? `N° ${esc(L.ventaNota)} ${fmtFecha(L.ventaFecha)}` : ''}</td></tr>`).join('')}
  </tbody></table></div></td></tr>`).join('')}

  </tbody></table></div>`;
  wireTipo(v);

  $('#vfQ').oninput = e => { vf.q = e.target.value; clearTimeout(S._vq); S._vq = setTimeout(() => { render(); const n = $('#vfQ'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 300); };
  $('#vfAg').onchange = e => { vf.agente = e.target.value; re(); }; $('#vfLocal').onchange = e => { vf.local = e.target.value; re(); }; $('#vfJefe').onchange = e => { vf.jefe = e.target.value; re(); }; $('#vfMarca').onchange = e => { vf.marca = e.target.value; re(); };

  $('#vfLimpiar').onclick = () => { S.vendFiltro = { agente: 'todos', sort: 'score' }; re(); };
  v.querySelectorAll('.vrow').forEach(r => r.onclick = () => r.classList.toggle('open'));
  const filaExport = f => [f.vend, f.local, f.jefe, f.marcas, f.m.cargado, f.m.contactado, f.m.noContesta, f.m.pendiente, f.m.pFfvv, f.m.pSinFfvv, f.m.pPpto, f.m.pSigue, f.m.pExplico, f.m.pEntendio, f.m.pInvito, f.m.rescatado, f.m.tasaRescate, f.m.rescVenta, f.m.conVenta, ...AGENTES.map(x => f.porAg[x.key]), f.sc];

  $('#vExportRep').onclick = () => {

    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['#', 'VENDEDOR', 'LOCAL', 'JEFE', 'LEADS', 'RESCATADOS', 'TASA RESCATE', 'RESCATES CON VENTA', 'SIN CONTACTO DEL VENDEDOR %', 'PPTO NO ENVIADO %', 'SCORING', ...AGENTES.map(x => 'RESC ' + x.corto.toUpperCase())], ...rk.map((f, i) => [i + 1, f.vend, f.local, f.jefe, f.m.cargado, f.m.rescatado, f.m.tasaRescate, f.m.rescVenta, f.m.pSinFfvv, f.m.pPptoNo, f.sc, ...AGENTES.map(x => f.porAg[x.key])])]), 'RANKING RESCATES');
    const porLocal = {}; for (const f of filas) { const k = f.local || '(sin local)'; const o = porLocal[k] = porLocal[k] || { leads: 0, resc: 0, vend: 0 }; o.leads += f.m.cargado; o.resc += f.m.rescatado; o.vend++; }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['LOCAL', 'VENDEDORES', 'LEADS', 'RESCATADOS', 'TASA RESCATE'], ...Object.entries(porLocal).sort((a, b) => b[1].resc - a[1].resc).map(([k, o]) => [k, o.vend, o.leads, o.resc, o.leads ? o.resc / o.leads : 0])]), 'POR LOCAL');
    const det = rk.flatMap(f => f.arr.filter(L => norm(L.r?.estado) === 'RESCATADO').map(L => [f.vend, f.local, AG[L.agente]?.nombre || '', (L.id || '').replace(/^[PR]/, ''), fmtFecha(L.creado), `${L.nombre || ''} ${L.apellido || ''}`.trim(), L.cel || L.tel || '', L.producto || '', L.r?.motivoR || '', L.r?.comentario || '', L.ventaNota ? 'SI' : 'NO']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['VENDEDOR', 'LOCAL', 'EJECUTIVA', 'ID PILOT', 'CREADO', 'CLIENTE', 'CELULAR', 'PRODUCTO', 'MOTIVO RESCATE', 'COMENTARIO', 'CON VENTA'], ...det]), 'DETALLE RESCATES');
    XLSX.writeFile(wb, `REPORTE_RESCATES_${S.periodo}.xlsx`);
  };
}
function claseFila(L) { const r = L.r || {}; if (L.tipo === 'SEMINUEVO') return r.derivVend ? 'resc' : norm(r.estado) ? 'noresc' : 'pend'; if (!norm(r.cc)) return 'pend'; const e = norm(r.estado); return e === 'RESCATADO' ? 'resc' : e ? 'noresc' : ''; }

/* --- Historial de cargas --- */
function vistaCargas(v) {
  v.innerHTML = `<h2>Historial de cargas</h2>${esAdmin() ? '<div id="limpieza"></div>' : ''}<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Archivo</th><th>Registros</th><th>Reparto</th><th>Duplicados</th><th>Excluidos</th><th>Meses</th><th></th></tr></thead><tbody>
  ${S.cargas.map(c => `<tr><td>${new Date(c.fecha).toLocaleString('es-CL')}</td><td><span class="tag ${c.clase === 'VENTAS' ? 'med' : c.clase === 'IMPORT' ? 'bad' : 'ok'}">${esc(c.clase === 'VENTAS' ? 'Ventas SIGA' : c.clase === 'IMPORT' ? 'Planilla' : 'Pilot')}</span></td><td>${esc(c.archivo)}</td><td>${n0(c.total)}</td><td class="small">${AGENTES.map(a => `${a.corto}: ${n0(c.asig?.[a.key])}`).join(' · ')}</td><td>${n0(c.dupes)}</td><td>${n0(c.excluidos)}</td><td class="small">${(c.periodos || []).map(nombrePeriodo).join(', ')}</td><td>${puedoCargar() ? `<button class="btn sm" data-del="${c.id}">Deshacer</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Aún no hay cargas.</td></tr>'}
  </tbody></table></div><p class="mini">“Deshacer” borra los registros de esa carga: leads de Pilot (con sus respuestas); en una importación de planilla, los leads que creó <b>y</b> las respuestas que copió sobre leads que ya existían (solo las que nadie cambió después); en ventas SIGA, las ventas y se recalcula el cruce.</p>`;
  if (esAdmin()) sb.rpc('contar_duplicados').then(r => {
    const n = +(r.data || 0); const box = $('#limpieza'); if (!box || r.error || !n) return;
    box.insertAdjacentHTML('afterbegin', `<div class="panel" style="margin-top:10px;border-left:5px solid var(--med)"><h3>Duplicados ya cargados</h3><p class="small">Hay <b>${n0(n)}</b> leads que repiten RUT-teléfono-correo de otro lead. Al borrarlos se conserva, por cada cliente, el lead con más respuestas (y si empatan, el más antiguo).</p><div class="row" style="margin-top:8px"><button class="btn pri" id="dupOk">Borrar ${n0(n)} duplicados</button></div><p class="mini" id="dupMsg"></p></div>`);
    $('#dupOk').onclick = async () => { if (!confirm(`¿Borrar ${n0(n)} leads duplicados? No se puede deshacer.`)) return; $('#dupOk').disabled = true; const { data, error } = await sb.rpc('eliminar_duplicados'); if (error) { $('#dupMsg').textContent = 'Error: ' + error.message; $('#dupOk').disabled = false; return; } toast(`Borrados ${n0(data?.[0]?.borrados)} duplicados`, 6000); S.rescatados = null; cargarLeads(); };
  });
  if (esAdmin()) sb.rpc('contar_import_antiguo').then(r => {
    const n = +(r.data || 0); const box = $('#limpieza'); if (!box || r.error || !n) return;
    box.innerHTML = `<div class="panel" style="margin-top:10px;border-left:5px solid var(--bad)"><h3>Importación antigua sin registro de carga</h3><p class="small">Hay <b>${n0(n)}</b> leads que vienen de una importación de planilla hecha antes de que existiera el historial (no tienen carga asociada), por eso no aparecen abajo. Puedes borrarlos aquí. Opcional: indica el rango de fecha y hora en que hiciste esa importación para revertir también las respuestas que copió sobre leads de Pilot (solo las grabadas con tu usuario en ese rango).</p>
      <div class="row" style="margin-top:8px"><label class="small">Desde<input class="sel" id="laDesde" type="datetime-local"></label><label class="small">Hasta<input class="sel" id="laHasta" type="datetime-local"></label><button class="btn pri" id="laOk">Borrar ${n0(n)} leads importados</button></div><p class="mini" id="laMsg"></p></div>`;
    $('#laOk').onclick = async () => {
      const d = $('#laDesde').value, h = $('#laHasta').value;
      if (!confirm(`¿Borrar ${n0(n)} leads importados${d && h ? ' y revertir las respuestas copiadas en ese rango' : ''}? No se puede deshacer.`)) return;
      $('#laOk').disabled = true;
      const { data, error } = await sb.rpc('limpiar_import_antiguo', { desde: d ? new Date(d).toISOString() : null, hasta: h ? new Date(h).toISOString() : null });
      if (error) { $('#laMsg').textContent = 'Error: ' + error.message; $('#laOk').disabled = false; return; }
      toast(`Borrados ${n0(data?.[0]?.leads_borrados)} leads · respuestas revertidas en ${n0(data?.[0]?.leads_revertidos)} leads`, 8000);
      await cargarPeriodos(); cargarLeads();
    };
  });
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const c = S.cargas.find(x => String(x.id) === b.dataset.del); if (!c) return;
    const esImp = c.clase === 'IMPORT';
    if (!confirm(esImp ? `¿Deshacer la importación de ${c.archivo}? Se borran los ${n0(c.total)} leads que creó y se limpian las respuestas que copió sobre los ${n0(c.dupes)} leads que ya existían.` : `¿Borrar la carga de ${c.archivo} (${c.total} ${c.clase === 'VENTAS' ? 'ventas' : 'leads'})${c.clase === 'VENTAS' ? '' : ' y todas sus respuestas'}?`)) return;
    b.disabled = true;
    if (esImp) { const r = await sb.rpc('revertir_import', { cid: c.id }); if (r.error) { toast('No se pudo revertir las respuestas: ' + r.error.message + ' (¿corriste 08_revertir_import.sql?)', 7000); b.disabled = false; return; } toast(`Respuestas revertidas en ${n0(r.data?.[0]?.leads_revertidos ?? 0)} leads existentes`, 5000); }
    const { error } = await sb.from('cargas').delete().eq('id', c.id);
    if (error) { toast('No se pudo borrar: ' + error.message); b.disabled = false; return; }
    if (c.clase === 'VENTAS') await sb.rpc('cruzar_ventas');
    toast('Carga eliminada'); await cargarConfig(); cargarLeads();
  });
}

/* ===== WhatsApp ===== */
const WA_DEF = {
  NUEVO: '{saludo} {nombre}, le escribe {ejecutiva} de DITALCAR, concesionario de vehículos \u{1F697}\u{2728}, en relación a su solicitud de cotización del modelo *{modelo}* \u{1F4CB}\n\n¿Quisiera saber si el vendedor ya le envió la cotización o se puso en contacto con usted? \u{1F60A}\nQuedo atenta para ayudarle \u{1F64C}',
  SEMINUEVO: '{saludo} {nombre}, le escribe {ejecutiva} de DITALCAR, concesionario de vehículos \u{1F697}\u{2728}\nMostró interés en nuestro seminuevo *{modelo}* \u{1F64C}\nEl vehículo lo tenemos disponible en nuestra sucursal de {sucursal} \u{1F4CD}\n¿Cómo le acomoda que le envíe la información? \u{1F60A}',
};
const waPlantilla = tipo => { const t = S.ajustes.whatsapp && S.ajustes.whatsapp[tipo]; return t && !/\uFFFD/.test(t) ? t : WA_DEF[tipo]; };
function waTelefono(L) { const d = String(L.cel || L.tel || '').replace(/\D/g, ''); if (!d) return ''; if (d.length === 9 && d.startsWith('9')) return '56' + d; if (d.length === 8) return '569' + d; if (d.length === 11 && d.startsWith('56')) return d; if (d.length === 12 && d.startsWith('056')) return d.slice(1); return d.length >= 9 ? d : ''; }
const capitalizar = s => String(s || '').trim().toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());
function waMensaje(L, key) {
  const h = new Date().getHours(); const saludo = h < 12 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
  const nombre = capitalizar((L.nombre || '').split(' ')[0]) || 'estimado/a';
  const suc = (L.r?.derivSuc || L.sucursal || L.local || '').replace(/^Suc\.?\s*/i, '').replace(/^Seminuevos?\s*/i, '').trim() || 'nuestra sucursal';
  const modelo = (L.producto || 'de su interés').toUpperCase();
  return waPlantilla(L.tipo).replace(/\{saludo\}/g, saludo).replace(/\{nombre\}/g, nombre).replace(/\{ejecutiva\}/g, AG[key]?.corto || '').replace(/\{modelo\}/g, modelo).replace(/\{sucursal\}/g, suc).replace(/\{vendedor\}/g, capitalizar(L.r?.derivVend || L.vendedor || ''));
}
// Siempre la misma pestaña de WhatsApp (nombre de ventana fijo). WhatsApp Web reutiliza la sesión y solo cambia el chat.
// Modo "panel lateral": ventana propia de WhatsApp Web acoplada a la derecha de la pantalla (WhatsApp no permite incrustarse dentro de otra página).
function waVentana(url) {
  const lateral = LS.get('waLateral', true);
  let w = null;
  if (lateral) { const ancho = Math.max(420, Math.round(screen.availWidth * 0.36)), alto = screen.availHeight; w = window.open(url, 'ditalcar_whatsapp', `popup=yes,width=${ancho},height=${alto},left=${screen.availWidth - ancho},top=0,resizable=yes,scrollbars=yes`); }
  else w = window.open(url, 'ditalcar_whatsapp');
  if (w) { try { w.focus(); } catch { } } else toast('El navegador bloqueó la ventana de WhatsApp: permite ventanas emergentes para esta página', 6000);
}
function abrirWhatsApp(L, key) {
  const tel = waTelefono(L); if (!tel) { toast('Este lead no tiene un celular válido'); return; }
  waVentana(`https://web.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(waMensaje(L, key))}`);
}

/* ===== Transferir lead ===== */
function transferirLead(L, key) {

/* ===== Lead manual ===== */
function formLead(key, L) {
  const host = $('#formLead'); if (!host) return;
  const edit = !!L, man = !L || esManual(L); const hoy = new Date(); const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
  const vend = [...new Set(S.vendedores.map(v => v.nombre).filter(Boolean))].sort(), suc = [...new Set(S.vendedores.map(v => v.sucursal).filter(Boolean))].sort();
  const marcas = [...new Set([...MARCAS_BASE, ...S.leads.map(x => x.negocio).filter(Boolean)])].sort();
  const val = k => esc(L?.[k] || ''); const opt = (arr, cur) => `<option value="">—</option>${arr.map(o => `<option ${norm(cur) === norm(o) ? 'selected' : ''}>${esc(o)}</option>`).join('')}`;
  host.innerHTML = `<div class="panel" style="margin-bottom:10px;border-left:5px solid var(--ac)"><div class="row" style="justify-content:space-between"><h3>${edit ? (man ? 'Editar lead manual' : 'Editar datos del lead ' + esc(L.id.replace(/^[PR]/, ''))) : 'Agregar lead'} <span class="muted small">(${S.tipo === 'NUEVO' ? 'nuevo' : 'seminuevo'}${man ? ' · basta con un dato' : ' · de Pilot: el ID y la fecha no se cambian'})</span></h3><button class="btn sm" id="flCerrar">✕</button></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px">
      <label class="small">ID Pilot (opcional)<input class="sel" id="fl_idpilot" value="${edit && !L.id.startsWith('M') ? esc(L.id.replace(/^[PRX]/, '')) : ''}" placeholder="N° del lead en Pilot" ${man ? '' : 'readonly'} style="width:100%"></label>
      <label class="small">Fecha<input class="sel" id="fl_creado" type="date" value="${L?.creado ? L.creado.slice(0, 10) : hoyStr}" ${man ? '' : 'readonly'} style="width:100%"></label>
      <label class="small">Marca<select class="sel" id="fl_negocio" style="width:100%">${opt(marcas, L?.negocio)}</select></label>
      <label class="small">Vendedor<select class="sel" id="fl_vendedor" style="width:100%">${opt(vend, L?.vendedor)}</select></label>
      <label class="small">Sucursal<select class="sel" id="fl_sucursal" style="width:100%">${opt(suc, L?.sucursal)}</select></label>
      <label class="small">Nombre<input class="sel" id="fl_nombre" value="${val('nombre')}" style="width:100%"></label>
      <label class="small">Apellido<input class="sel" id="fl_apellido" value="${val('apellido')}" style="width:100%"></label>
      <label class="small">RUT<input class="sel" id="fl_doc" value="${val('doc')}" style="width:100%"></label>
      <label class="small">Celular<input class="sel" id="fl_cel" value="${val('cel')}" style="width:100%"></label>
      <label class="small">Email<input class="sel" id="fl_email" value="${val('email')}" style="width:100%"></label>
      <label class="small">Producto / modelo<input class="sel" id="fl_producto" value="${val('producto')}" style="width:100%"></label>
      <label class="small">Origen<input class="sel" id="fl_origen" value="${val('origen')}" placeholder="WhatsApp, llamada, web…" style="width:100%"></label>
      <label class="small">Notas<input class="sel" id="fl_notas" value="${val('notas')}" style="width:100%"></label>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="flGuardar">${edit ? 'Guardar cambios' : 'Agregar lead'}</button>${edit && man ? '<button class="btn" id="flBorrar">Borrar lead</button>' : ''}<span class="mini" id="flMsg"></span></div></div>`;
  $('#flCerrar').onclick = () => { host.innerHTML = ''; };

  $('#flGuardar').onclick = async () => {

    const info = buscarVendedor(idxVend(), datos.vendedor); if (info) { datos.jefe = info.jefe; if (!datos.local) datos.local = info.sucursal; }
    $('#flGuardar').disabled = true;

    const nuevoId = idp ? 'P' + idp : null;

        const bt = $('#flTransferir'); if (bt) bt.onclick = async () => { bt.disabled = true; const { error } = await sb.rpc('transferir_lead', { p_id: x.id_lead }); if (error) { msg('No se pudo transferir: ' + esc(error.message)); return; } toast(`Lead transferido a tu bandeja${x.periodo !== S.periodo ? ' (está en ' + nombrePeriodo(x.periodo) + ')' : ''}`, 6000); host.innerHTML = ''; S.rescatados = null; cargarLeads(); };
        const bf = $('#flForzar'); if (bf) bf.onclick = () => { S._flForzar = true; $('#flGuardar').click(); };
        return;
      }

  };
  const fb = $('#flBorrar'); if (fb) fb.onclick = async () => { if (!confirm('¿Borrar este lead manual?')) return; const { error } = await sb.from('leads').delete().eq('id_lead', L.id); if (error) { toast(error.message); return; } host.innerHTML = ''; toast('Lead borrado'); cargarLeads(); };

const HOJA_AG = { KATHERINE: 'katherine', MILLARAY: 'millaray', CAMILA: 'camila', 'MARIA JOSE': 'mariajose' };
function colPregunta(h) {
  const n = norm(h).replace(/[¿?]/g, '').trim();
  if (n === 'ESTADO LEAD' || !n) return null;
  if (n.startsWith('CONTACTADO POR CC') || n.startsWith('CONTACTADOPORCC')) return 'cc';
  if (n.startsWith('FUE CONTACTADO')) return 'ffvv'; if (n.startsWith('PRESUPUESTO ENV')) return 'ppto'; if (n.startsWith('COTIZACION')) return 'cot';
  if (n.startsWith('SIGUE EN CONTACTO')) return 'sigue'; if (n.startsWith('LE EXPLICO')) return 'explico'; if (n.startsWith('LA ENTENDIO')) return 'entendio'; if (n.startsWith('LO INVITO')) return 'invito';
  if (n === 'ESTADO') return 'estado'; if (n.startsWith('MOTIVO RESCATE')) return 'motivoR'; if (n.startsWith('MOTIVO NO RESCATE')) return 'motivoNR'; if (n === 'COMENTARIO') return 'comentario';
  return null;
}
function valorLista(k, v) { const s = String(v ?? '').trim(); if (!s) return ''; if (k === 'comentario') return s; const n = norm(s).replace(/^SÍ$/, 'SI'); const q = [...PREGUNTAS.NUEVO, ...PREGUNTAS.SEMINUEVO].find(x => x.k === k); const ok = q && LISTAS[q.lista]?.find(o => norm(o) === n); return ok || n; }
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); };
const claveLead = x => `${normName(x.doc) || normName((x.nombre || '') + (x.apellido || ''))}|${norm(x.producto)}|${(x.creado || '').slice(0, 10)}`;
const claveCel = x => { const c = String(x.cel || x.tel || '').replace(/\D/g, '').slice(-8); return c.length === 8 ? `${c}|${(x.creado || '').slice(0, 10)}` : ''; };
const remotoDe = x => ((x.notas || '').match(/ID Remoto:\s*([A-Za-z0-9]+)/i) || [])[1] || '';
function vistaImportar(v) {

function leerPlanilla(file) {
  const fr = new FileReader(); S.importar = { estado: 'leyendo', msg: 'Leyendo planilla…', archivo: file.name }; render();
  fr.onload = async e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const im = S.importar; im.hojas = []; im.periodos = new Set(); const vistos = new Set(); const filas = [];
      for (const sh of wb.SheetNames) {
        const mm = sh.match(/^PILOT (NUEVO|SEMINUEVO) (.+)$/i); if (!mm) continue;
        const tipo = mm[1].toUpperCase(), agente = HOJA_AG[norm(mm[2])]; if (!agente) continue;
        im.msg = `Leyendo ${sh}…`; render(); await new Promise(r => setTimeout(r, 10));
        const matriz = XLSX.utils.sheet_to_json(wb.Sheets[sh], { header: 1, raw: true });
        const mapeo = mapearColumnas(matriz); if (!mapeo || mapeo.hits < 4) continue;
        if (tipo === 'SEMINUEVO' && mapeo.map.estadoLead != null && norm(mapeo.headers[mapeo.map.estadoLead]) === 'ESTADO') delete mapeo.map.estadoLead;
        const preg = {}; (matriz[mapeo.fila] || []).forEach((h, i) => { const k = colPregunta(h); if (k && !(k in preg)) preg[k] = i; });
        const leads = extraerLeads(matriz, mapeo, tipo);
        // respuestas: volver a recorrer las filas en el mismo orden que extraerLeads
        let j = 0; const h = { nombre: sh, leidos: 0, match: 0, nuevos: 0, conResp: 0, repetidos: 0 };
        for (let r = mapeo.fila + 1; r < matriz.length; r++) {
          const row = matriz[r]; if (!row || row.every(x => x == null || x === '')) continue;
          const L = leads[j]; if (!L) break; const nm = mapeo.map.nombre != null ? row[mapeo.map.nombre] : '', pr = mapeo.map.producto != null ? row[mapeo.map.producto] : '';
          if (!String(nm ?? '').trim() && !String(pr ?? '').trim()) continue; j++;
          L.r = {}; for (const [k, i] of Object.entries(preg)) { const val = valorLista(k, row[i]); if (val) L.r[k] = val; }
          L.tipo = tipo; L.agente = agente;
          if (!L.periodo || L.periodo < '2024-01') { h.sinFecha = (h.sinFecha || 0) + 1; h.leidos++; continue; }
          const clave = `${tipo}|${remotoDe(L) || claveLead(L)}`; h.leidos++;
          if (vistos.has(clave)) { h.repetidos++; continue; } vistos.add(clave);
          if (Object.keys(L.r).length) h.conResp++;
          im.periodos.add(L.periodo); filas.push({ L, h });
        }
        im.hojas.push(h);
      }
      if (!filas.length) { S.importar = null; render(); toast('No encontré hojas PILOT NUEVO / SEMINUEVO con datos', 5000); return; }
      // existentes en plataforma para esos meses
      im.msg = 'Comparando con la plataforma…'; render();
      const periodos = [...im.periodos]; const ex = [];
      for (let i = 0; i < periodos.length; i += 4) { im.sub = `meses ${i + 1}–${Math.min(i + 4, periodos.length)} de ${periodos.length}`; im.pct = Math.round(i / periodos.length * 100); render(); ex.push(...await traerTodo(sb.from('leads').select('id_lead,tipo,periodo,agente,notas,doc,nombre,apellido,producto,creado,cel,tel,cc,ffvv,ppto,cot,sigue,explico,entendio,invito,estado,motivo_r,motivo_nr,comentario').in('periodo', periodos.slice(i, i + 4)))); }
      const byRem = {}, byKey = {}, byCel = {};
      for (const row of ex) { const x = filaALead(row); const rm = remotoDe(x); if (rm) byRem[`${x.tipo}|${rm}`] = row; byKey[`${x.tipo}|${claveLead(x)}`] = row; const ck = claveCel(x); if (ck) byCel[`${x.tipo}|${ck}`] = row; }
      im.actualizar = []; im.crear = []; const usados = new Set();
      for (const { L, h } of filas) {
        const rm = remotoDe(L); const row = (rm && byRem[`${L.tipo}|${rm}`]) || byKey[`${L.tipo}|${claveLead(L)}`] || (claveCel(L) && byCel[`${L.tipo}|${claveCel(L)}`]);
        if (row && !usados.has(row.id_lead)) {
          usados.add(row.id_lead); h.match++;
          const cambios = {}; for (const [k, c] of Object.entries(RESP_DB)) if (L.r[k] && !row[c]) cambios[c] = L.r[k];
          im.actualizar.push({ id_lead: row.id_lead, tipo: row.tipo, periodo: row.periodo, agente: row.agente, cambios });
        } else { h.nuevos++; L.id = rm ? 'R' + rm : 'X' + hash(claveLead(L)); if (!L.vendedor) { const vv = buscarVendedor(idxVend(), L.asignadoA); L.vendedor = vv ? vv.nombre : normName(L.asignadoA); L.jefe = vv ? vv.jefe : ''; L.local = vv ? vv.sucursal : norm(L.sucursal); } im.crear.push(L); }
      }
      im.estado = 'listo'; render();
    } catch (err) { console.error(err); S.importar = null; render(); toast('No pude leer la planilla: ' + err.message, 6000); }
  };

  for (const tipo of ['NUEVO', 'SEMINUEVO']) for (const a of AGENTES) {
    const leads = leadsPeriodo(tipo, a.key); if (!leads.length) continue; const Q = PREGUNTAS[tipo];
    const rows = leads.map(L => [(L.id || '').replace(/^[PR]/, ''), ...keys[tipo].map(k => k === 'creado' ? fmtFecha(L[k]) : (L[k] || '')), ...Q.map(q => L.r?.[q.k] || ''), L.vendedor || '', L.jefe || '', L.local || '', L.ventaNota || '', fmtFecha(L.ventaFecha), L.ventaMatch || '', L.ventaVendedor || '', L.ventaLocal || '']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['ID PILOT', ...base[tipo], ...Q.map(q => q.t.toUpperCase()), 'VENDEDOR', 'JEFE', 'LOCAL', 'VENTA N°', 'VENTA FECHA', 'CRUCE POR', 'VENTA VENDEDOR', 'VENTA LOCAL'], ...rows]), `${tipo} ${a.corto.toUpperCase().replace('Í', 'I')}`.slice(0, 31));
  }
  const res = [['EJECUTIVA', 'TIPO', 'CARGADOS', 'CONTACTADOS', 'NO CONTESTA', 'PENDIENTES', 'TASA CONTACTO', 'RESCATADOS', 'TASA RESCATE', 'NO RESCATADOS', 'RESCATES C/VENTA', 'TASA CIERRE RESCATE', 'DERIVADOS', 'TASA DERIVACION', 'CON VENTA', 'TASA CIERRE WEB']];
  for (const tipo of ['NUEVO', 'SEMINUEVO']) for (const a of [...AGENTES, { nombre: 'TOTAL EQUIPO', key: null }]) { const m = metricas(leadsPeriodo(tipo, a.key)); if (m.cargado) res.push([a.nombre, tipo, m.cargado, m.contactado, m.noContesta, m.pendiente, m.tasaContacto, m.rescatado, m.tasaRescate, m.noRescatado, m.rescVenta, m.tasaCierreRescate, m.derivado, m.tasaDerivacion, m.conVenta, m.tasaCierre]); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(res), 'RESUMEN');
  const vend = [['VENDEDOR', 'LOCAL', 'LEADS', 'CONTACTADO', 'NO CONTESTA', 'EN GESTION CC', 'CONTACTO C/VEND %', 'PPTO ENV %', 'SIGUE %', 'PPTO EXPLICADO %', 'INVITÓ %', 'RESCATADO %', 'SCORING']];
  const por = {}; for (const L of leadsPeriodo('NUEVO')) (por[L.vendedor || '(sin vendedor)'] = por[L.vendedor || '(sin vendedor)'] || []).push(L);
  for (const [vn, arr] of Object.entries(por)) { const m = metricas(arr); vend.push([vn, arr[0].local || '', m.cargado, m.contactado, m.noContesta, m.pendiente, m.pFfvv, m.pPpto, m.pSigue, m.pExplico, m.pInvito, m.pResc, scoring(m, S.ajustes.scoring).total]); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(vend), 'VENDEDORES');
  XLSX.writeFile(wb, `RESCATE_LEADS_${S.periodo}.xlsx`);
}
